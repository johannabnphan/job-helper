<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Generic application (fixture)</title>
<style>body{font:14px system-ui;max-width:640px;margin:40px auto}label{display:block;margin:12px 0 4px}input,select,textarea{width:100%;padding:6px}</style>
</head>
<body>
<header><input type="text" placeholder="Search jobs"></header>
<h1>Apply: Product Designer</h1>
<form id="app" onsubmit="window.__submitted = true; return false;">
  <label for="fn">First Name *</label><input id="fn" name="first_name" required>
  <label for="ln">Last Name *</label><input id="ln" name="last_name" required>
  <label>Email <input type="email" name="email"></label>
  <label for="ph">Phone</label><input id="ph" type="tel">
  <div class="field"><div class="label">LinkedIn Profile</div><input name="q1"></div>
  <label for="web">Website</label><input id="web" type="url">
  <label for="loc">Current location</label><input id="loc">
  <label for="auth">Are you legally authorized to work in the United States?</label>
  <select id="auth"><option value="">Select...</option><option>Yes</option><option>No</option></select>
  <fieldset><legend>Will you now or in the future require visa sponsorship?</legend>
    <label><input type="radio" name="spons" value="1"> Yes</label>
    <label><input type="radio" name="spons" value="0"> No</label>
  </fieldset>
  <label for="hear">How did you hear about this job?</label>
  <select id="hear"><option value="">--</option><option>Company website</option><option>LinkedIn</option><option>Referral</option></select>
  <label for="reloc">Are you willing to relocate?</label><input id="reloc">
  <label for="sal">Desired salary</label><input id="sal">
  <label for="why">Why do you want to work at Example Co?</label><textarea id="why"></textarea>
  <label for="cv">Resume/CV</label><input id="cv" type="file">
  <label for="gender">Gender</label>
  <select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>I don't wish to answer</option></select>
  <label for="yrs">Years of experience with Figma</label><input id="yrs" required>
  <label for="prefilled">Preferred name</label><input id="prefilled" value="Already typed">
  <button>Submit application</button>
</form>
<script>
  const $ = (s) => document.querySelector(s);
  window.__expect = () => ({
    'first name': $('#fn').value === 'Alex',
    'email': $('[name=email]').value === 'alex.rivera@example.com',
    'linkedin via nearby label': $('[name=q1]').value.includes('linkedin.com'),
    'authorized select = Yes': $('#auth').value === 'Yes',
    'sponsorship radio = No': $('input[name=spons][value="0"]').checked,
    'answer bank select': $('#hear').value === 'LinkedIn',
    'resume attached': $('#cv').files.length === 1,
    'open-ended left empty': $('#why').value === '',
    'search box untouched': $('header input').value === '',
    'pre-filled value replaced with profile': $('#prefilled').value === 'Alex',
  });
</script>
</body>
</html>
