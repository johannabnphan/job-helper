<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contoso Media - Product Designer (fixture)</title>
<style>body{font:14px system-ui;max-width:640px;margin:40px auto}.application-question{list-style:none;margin:12px 0}input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{width:100%;padding:6px}ul{padding:0}</style>
</head>
<body>
<form id="application-form" method="POST" onsubmit="window.__submitted = true; return false;">
  <h4>Submit your application</h4>
  <ul>
    <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
      <div class="application-field"><input type="file" name="resume" id="resume-upload-input"></div></label></li>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
      <div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
      <div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div>
      <div class="application-field"><input type="text" name="phone"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current location</div>
      <div class="application-field"><input type="text" name="location" class="location-input"><input type="hidden" name="selectedLocation"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div>
      <div class="application-field"><input type="text" name="org"></div></label></li>
  </ul>
  <h4>Links</h4>
  <ul>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    <li class="application-question"><label><div class="application-label">Twitter URL</div><div class="application-field"><input type="text" name="urls[Twitter]"></div></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
    <li class="application-question"><label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
  </ul>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">Are you legally authorized to work in the country in which this job is located?<span class="required">✱</span></div></div>
    <div class="application-field"><ul data-qa="multiple-choice">
      <li><label><input type="radio" name="cards[abc][field0]" value="Yes"><span class="application-answer-alternative">Yes</span></label></li>
      <li><label><input type="radio" name="cards[abc][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
    </ul></div>
  </div>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">How did you hear about this opportunity?</div></div>
    <div class="application-field"><select name="cards[abc][field1]"><option value="">Select...</option><option>Job board</option><option>LinkedIn</option><option>Friend</option></select></div>
  </div>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">Are you open to relocating to New York?</div></div>
    <div class="application-field"><textarea name="cards[abc][field2]"></textarea></div>
  </div>
  <div class="application-question">
    <div class="application-label">Additional information</div>
    <div class="application-field"><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div>
  </div>
  <h4>U.S. Equal Employment Opportunity information</h4>
  <div class="application-question"><div class="application-label">Gender</div>
    <div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option>Male</option><option>Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></div>
  <div class="application-question"><div class="application-label">Veteran status</div>
    <div class="application-field"><select name="eeo[veteran]"><option value="">Select ...</option><option>I am a veteran</option><option>I am not a veteran</option><option>Decline to self-identify</option></select></div></div>
  <label><input type="checkbox" name="consent[marketing]"> Send me future job opportunities</label>
  <button type="submit" id="btn-submit" class="template-btn-submit">Submit application</button>
</form>
<script>
  const $ = (s) => document.querySelector(s);
  window.__expect = () => ({
    'resume attached': $('[name=resume]').files.length === 1,
    'full name': $('[name=name]').value === 'Alex Rivera',
    'current company': $('[name=org]').value === 'Northwind Labs',
    'location typed': $('[name=location]').value.startsWith('Brooklyn'),
    'linkedin': $('[name="urls[LinkedIn]"]').value.includes('linkedin'),
    'twitter left empty': $('[name="urls[Twitter]"]').value === '',
    'github': $('[name="urls[GitHub]"]').value.includes('github'),
    'authorized radio = Yes': $('input[value=Yes]').checked,
    'heard via answer bank': $('[name="cards[abc][field1]"]').value === 'LinkedIn',
    'relocation from answer bank': $('[name="cards[abc][field2]"]').value.startsWith('Open to relocating'),
    'comments left empty': $('[name=comments]').value === '',
    'gender': $('[name="eeo[gender]"]').value === 'Decline to self-identify',
    'veteran (closest option)': $('[name="eeo[veteran]"]').value === 'I am not a veteran',
    'marketing consent untouched': !$('[name="consent[marketing]"]').checked,
  });
</script>
</body>
</html>
