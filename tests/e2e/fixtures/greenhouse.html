<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Product Designer at Northwind (fixture)</title>
<style>body{font:14px system-ui;max-width:640px;margin:40px auto}.field-wrapper{margin:12px 0}.label{display:block;margin-bottom:4px}input:not([type=file]),select,textarea{width:100%;padding:6px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.select__control{border:1px solid #999;padding:2px 6px}.select__single-value{min-height:1em;color:#333}</style>
<script src="widgets.js"></script>
</head>
<body>
<h1>Product Designer</h1>
<form id="application-form" onsubmit="window.__submitted = true; return false;">
  <div class="field-wrapper"><label id="first_name-label" for="first_name" class="label">First Name<span>*</span></label><input id="first_name" aria-required="true"></div>
  <div class="field-wrapper"><label for="last_name" class="label">Last Name<span>*</span></label><input id="last_name" aria-required="true"></div>
  <div class="field-wrapper"><label for="preferred_name" class="label">Preferred First Name</label><input id="preferred_name"></div>
  <div class="field-wrapper"><label for="email" class="label">Email<span>*</span></label><input id="email" type="text"></div>
  <div class="field-wrapper"><label for="phone" class="label">Phone</label><input id="phone" type="tel"></div>
  <div class="field-wrapper"><label id="candidate-location-label" for="candidate-location" class="label">Location (City)</label>
    <div class="select__control"><div class="select__single-value"></div><input id="candidate-location" role="combobox" aria-autocomplete="list" aria-labelledby="candidate-location-label"></div></div>
  <div class="field-wrapper file-upload"><div id="upload-label-resume" class="label">Resume/CV<span>*</span></div>
    <button type="button">Attach</button><input type="file" id="resume" class="visually-hidden"></div>
  <div class="field-wrapper file-upload"><div id="upload-label-cover_letter" class="label">Cover Letter</div>
    <button type="button">Attach</button><input type="file" id="cover_letter" class="visually-hidden"></div>

  <h3>Education</h3>
  <div class="education--container">
    <div class="field-wrapper"><label for="school--0" class="label">School</label>
      <div class="select__control"><div class="select__single-value"></div><input id="school--0" role="combobox" aria-autocomplete="list"></div></div>
    <div class="field-wrapper"><label for="degree--0" class="label">Degree</label>
      <div class="select__control"><div class="select__single-value"></div><input id="degree--0" role="combobox" aria-autocomplete="list"></div></div>
    <div class="field-wrapper"><label for="discipline--0" class="label">Discipline</label>
      <div class="select__control"><div class="select__single-value"></div><input id="discipline--0" role="combobox" aria-autocomplete="list"></div></div>
    <div class="field-wrapper"><label for="end-year--0" class="label">End date year</label><input id="end-year--0"></div>
  </div>

  <div class="field-wrapper"><label for="question_101" class="label">LinkedIn Profile</label><input id="question_101"></div>
  <div class="field-wrapper"><label for="question_102" class="label">Website</label><input id="question_102"></div>
  <div class="field-wrapper"><label for="question_103" class="label">Are you legally authorized to work in the United States?*</label>
    <div class="select__control"><div class="select__single-value"></div><input id="question_103" role="combobox" aria-autocomplete="list"></div></div>
  <div class="field-wrapper"><label for="question_104" class="label">Will you now or in the future require sponsorship for employment visa status?*</label>
    <div class="select__control"><div class="select__single-value"></div><input id="question_104" role="combobox" aria-autocomplete="list"></div></div>
  <div class="field-wrapper"><label for="question_105" class="label">What interests you about Northwind?</label><textarea id="question_105"></textarea></div>

  <h3>Voluntary Self-Identification</h3>
  <div class="field-wrapper"><label for="gender" class="label">Gender</label>
    <div class="select__control"><div class="select__single-value"></div><input id="gender" role="combobox" aria-autocomplete="list"></div></div>
  <div class="field-wrapper"><label for="veteran_status" class="label">Veteran Status</label>
    <div class="select__control"><div class="select__single-value"></div><input id="veteran_status" role="combobox" aria-autocomplete="list"></div></div>
  <div class="field-wrapper"><label for="disability_status" class="label">Disability Status</label>
    <div class="select__control"><div class="select__single-value"></div><input id="disability_status" role="combobox" aria-autocomplete="list"></div></div>
  <button class="btn--pill" type="submit">Submit application</button>
</form>
<script>
  const yn = ['Yes', 'No'];
  fakeReactSelect(document.getElementById('candidate-location'), ['Brooklyn, New York, United States', 'Brookline, Massachusetts, United States']);
  fakeReactSelect(document.getElementById('school--0'), ['Rhode Island College', 'Rhode Island School of Design', 'Brown University']);
  fakeReactSelect(document.getElementById('degree--0'), ["High School", "Associate's Degree", "Bachelor's Degree", "Master's Degree"]);
  fakeReactSelect(document.getElementById('discipline--0'), ['Graphic Design', 'Industrial Design', 'Computer Science']);
  fakeReactSelect(document.getElementById('question_103'), yn);
  fakeReactSelect(document.getElementById('question_104'), yn);
  fakeReactSelect(document.getElementById('gender'), ['Male', 'Female', 'Decline To Self Identify']);
  fakeReactSelect(document.getElementById('veteran_status'), ['I am a protected veteran', 'I am not a protected veteran', "I don't wish to answer"]);
  fakeReactSelect(document.getElementById('disability_status'), ['Yes, I have a disability', "No, I don't have a disability", "I don't wish to answer"]);
  const $ = (s) => document.querySelector(s);
  const chosen = (id) => document.getElementById(id).closest('.select__control').querySelector('.select__single-value').textContent;
  window.__expect = () => ({
    'first name': $('#first_name').value === 'Alex',
    'preferred name falls back to first name': $('#preferred_name').value === 'Alex',
    'resume attached': $('#resume').files.length === 1,
    'cover letter not attached': $('#cover_letter').files.length === 0,
    'location picked from list': chosen('candidate-location') === 'Brooklyn, New York, United States',
    'school combobox': chosen('school--0') === 'Rhode Island School of Design',
    'degree level BFA -> Bachelor': chosen('degree--0') === "Bachelor's Degree",
    'discipline': chosen('discipline--0') === 'Graphic Design',
    'grad year': $('#end-year--0').value === '2018',
    'authorized = Yes': chosen('question_103') === 'Yes',
    'sponsorship = No': chosen('question_104') === 'No',
    'gender decline': chosen('gender') === 'Decline To Self Identify',
    'veteran': chosen('veteran_status') === 'I am not a protected veteran',
    'disability left for user': chosen('disability_status') === '',
    'open-ended left empty': $('#question_105').value === '',
  });
</script>
</body>
</html>
